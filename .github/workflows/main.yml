name: Build and Test Svelte Application

on: 
  push:
    branches:
      - "**"  #1.2 Trigger bij elke push naar elke branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Haal de laatste code op
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Installeer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3. Installeer dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Voer unit tests uit
      - name: Run test
        run: npm run test

      # 7. Run ESLint
      - name: Run ESLint
        run: npm run lint

      # 8. Analyze cyclomatic complexity and code smells
      - name: Analyze Cyclomatic Complexity
        run: |
          npm install -g plato
          plato -r -d complexity-report ./src

      # 9. Upload complexity report as artifact
      - name: Upload Complexity Report
        uses: actions/upload-artifact@v3
        with:
          name: complexity-report
          path: complexity-report/
